<ng-container *transloco="let t">
  <h1 class="m-0 px-4 pt-[calc(env(safe-area-inset-top)+var(--spacing-4))] pb-3 text-h3 text-fg">
    {{ t(titleKey()) }}
  </h1>
  <div class="flex flex-1 items-center justify-center">
    <app-luma-empty-state
      [icon]="icon()"
      [heading]="t('common.comingSoon')"
      [description]="t(descriptionKey())"
    />
  </div>
</ng-container>
