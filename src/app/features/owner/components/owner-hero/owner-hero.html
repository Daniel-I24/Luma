<section *transloco="let t" class="flex flex-col gap-3" [attr.aria-label]="business().name">
  <div class="relative overflow-hidden rounded-2xl bg-linear-to-br from-primary to-accent">
    @if (business().cover_url) {
    <app-luma-image class="block h-32 w-full opacity-90" [src]="business().cover_url" [alt]="''" [width]="640" [height]="256" />
    } @else {
    <div class="h-32 w-full" aria-hidden="true"></div>
    }
    <div class="absolute inset-x-0 bottom-0 flex items-end gap-3 bg-linear-to-t from-overlay to-transparent p-3">
      <app-luma-image
        class="size-16 shrink-0 overflow-hidden rounded-xl border-2 border-surface bg-surface"
        [src]="business().logo_url"
        [alt]="t('owner.hero.logo', { name: business().name })"
        [width]="64"
        [height]="64"
        fallbackIcon="store"
        iconSize="md"
      />
      <div class="flex min-w-0 flex-1 flex-col gap-1">
        <h1 class="m-0 truncate text-h3 text-primary-fg">{{ business().name }}</h1>
        <span class="w-fit rounded-full px-2 py-0.5 text-caption font-semibold" [class]="statusClass()">
          {{ t('owner.hero.status.' + business().verification_status) }}
        </span>
      </div>
    </div>
  </div>
  <nav class="grid grid-cols-4 gap-2" [attr.aria-label]="t('owner.hero.quickActions')">
    @for (action of actions(); track action.key) {
    <a
      class="pressable flex min-h-16 flex-col items-center justify-center gap-1 rounded-xl border border-border-subtle bg-surface p-2 text-center text-caption font-semibold text-fg no-underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-border-focus"
      [routerLink]="action.link"
    >
      <app-luma-icon class="text-fg-brand" [name]="action.icon" />
      {{ t('owner.hero.actions.' + action.key) }}
    </a>
    }
  </nav>
</section>
