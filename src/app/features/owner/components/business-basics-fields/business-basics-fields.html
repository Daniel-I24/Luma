<div *transloco="let t" class="flex flex-col gap-4">
  <app-luma-input
    [inputId]="idPrefix() + '-name'"
    [label]="t('businessPanel.form.name')"
    [placeholder]="t('businessPanel.form.namePlaceholder')"
    autocomplete="organization"
    [required]="true"
    [maxLength]="rules.name.maxLength"
    [errorMessage]="error('name')"
    [value]="draft().name"
    (valueChange)="set('name', $event)"
    (blurred)="check('name')"
  />
  <app-luma-select
    [selectId]="idPrefix() + '-category'"
    [label]="t('businessPanel.form.category')"
    [placeholder]="t('businessPanel.form.categoryPlaceholder')"
    [required]="true"
    [options]="categories()"
    [errorMessage]="error('category')"
    [value]="draft().category"
    (valueChange)="set('category', $event)"
  />
  <app-luma-input
    [inputId]="idPrefix() + '-phone'"
    [placeholder]="t('placeholders.mobile')"
    type="tel"
    inputMode="tel"
    autocomplete="tel-national"
    [label]="t('businessPanel.form.phone')"
    [hint]="t('businessPanel.form.phoneHint')"
    [maxLength]="rules.phone.maxLength"
    [errorMessage]="error('phone')"
    [value]="draft().phone"
    (valueChange)="set('phone', $event)"
    (blurred)="check('phone')"
  />
  <app-residence-picker
    legendKey="owner.wizard.municipalityLegend"
    purposeKey="owner.wizard.municipalityPurpose"
    [showNeighborhood]="false"
    [initialCode]="draft().cityDaneCode"
    [value]="draft().municipality"
    (valueChange)="setMunicipality($event)"
  />
  <app-location-picker
    [pickerId]="idPrefix() + '-location'"
    [errorMessage]="error('latitude') ?? error('longitude')"
    [centre]="centre()"
    [others]="others()"
    [position]="draft().location"
    (positionChange)="setLocation($event)"
  />
  <app-location-proposal [position]="confirmed()" (used)="useProposal($event)" />
  <app-luma-input
    [inputId]="idPrefix() + '-address'"
    [label]="t('businessPanel.form.address')"
    [placeholder]="t('businessPanel.form.addressPlaceholder')"
    [hint]="t('location.addressHint')"
    autocomplete="street-address"
    [required]="true"
    [maxLength]="rules.address.maxLength"
    [errorMessage]="error('address')"
    [value]="draft().address"
    (valueChange)="set('address', $event)"
    (blurred)="check('address')"
  />
  <app-luma-input
    [inputId]="idPrefix() + '-neighborhood'"
    [label]="t('location.sectorLabel')"
    [placeholder]="t('location.sectorPlaceholder')"
    [hint]="t('location.sectorHint')"
    [maxLength]="rules.neighborhood.maxLength"
    [errorMessage]="error('neighborhood')"
    [value]="draft().neighborhood"
    (valueChange)="set('neighborhood', $event)"
    (blurred)="check('neighborhood')"
  />
  <app-luma-input
    [inputId]="idPrefix() + '-reference'"
    [label]="t('location.referenceLabel')"
    [placeholder]="t('location.referencePlaceholder')"
    [maxLength]="rules.reference.maxLength"
    [errorMessage]="error('reference') ?? error('address_reference')"
    [value]="draft().reference"
    (valueChange)="set('reference', $event)"
    (blurred)="check('reference')"
  />
</div>
