<form
  *transloco="let t"
  class="flex flex-col gap-4 rounded-xl border border-border-subtle bg-surface p-4"
  novalidate
  aria-labelledby="legal-title"
  (submit)="save($event)"
>
  <h2 id="legal-title" class="m-0 text-title text-fg">
    {{ t('owner.verificationPage.legalTitle') }}
  </h2>
  <app-draft-notice [draft]="autosave" />
  <app-luma-input
    inputId="legal-tax-id"
    inputMode="numeric"
    [label]="t('verification.legal.taxId')"
    placeholder="800.197.268-4"
    [required]="true"
    [maxLength]="rules.taxId.maxLength"
    [disabled]="!store.editable()"
    [value]="taxId()"
    (valueChange)="edit('taxId', $event)"
    (blurred)="check('taxId')"
    [errorMessage]="errors().taxId ? t(errors().taxId!) : undefined"
  />
  <app-luma-input
    inputId="legal-name"
    [placeholder]="t('placeholders.legalName')"
    [label]="t('verification.legal.legalName')"
    [required]="true"
    autocomplete="organization"
    [maxLength]="rules.legalName.maxLength"
    [disabled]="!store.editable()"
    [value]="legalName()"
    (valueChange)="edit('legalName', $event)"
    (blurred)="check('legalName')"
    [errorMessage]="errors().legalName ? t(errors().legalName!) : undefined"
  />
  <app-luma-input
    inputId="legal-rep"
    [placeholder]="t('placeholders.fullName')"
    [label]="t('verification.legal.legalRep')"
    [required]="true"
    autocomplete="name"
    [maxLength]="rules.legalRep.maxLength"
    [disabled]="!store.editable()"
    [value]="legalRep()"
    (valueChange)="edit('legalRep', $event)"
    (blurred)="check('legalRep')"
    [errorMessage]="errors().legalRep ? t(errors().legalRep!) : undefined"
  />
  <p class="m-0 text-caption text-fg-muted">{{ t('owner.verificationPage.legalPrivacy') }}</p>
  @if (store.editable()) {
  <app-luma-button type="submit" [fullWidth]="true" [disabled]="store.busy()">
    {{ t('owner.verificationPage.saveLegal') }}
  </app-luma-button>
  }
</form>
