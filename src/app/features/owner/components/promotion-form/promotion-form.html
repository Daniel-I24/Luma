<form *transloco="let t" class="flex flex-col gap-4" novalidate (submit)="submit($event)">
  <app-draft-notice [draft]="autosave" />
  <app-luma-input
    inputId="promo-title"
    [placeholder]="t('placeholders.promoTitle')"
    [label]="t('businessPanel.promotions.promoTitle')"
    [required]="true"
    [maxLength]="rules.title.maxLength"
    [errorMessage]="errors()['title'] ? (errors()['title'] | transloco) : undefined"
    [value]="draft().title"
    (valueChange)="set('title', $event)"
    (blurred)="check('title', draft().title)"
  />
  <app-luma-input
    inputId="promo-starts"
    type="datetime-local"
    [label]="t('businessPanel.promotions.startsAt')"
    [required]="true"
    [errorMessage]="errors()['starts_at'] ? (errors()['starts_at'] | transloco) : undefined"
    [value]="draft().startsAt"
    (valueChange)="set('startsAt', $event)"
  />
  <app-luma-input
    inputId="promo-ends"
    type="datetime-local"
    [label]="t('businessPanel.promotions.endsAt')"
    [required]="true"
    [errorMessage]="errors()['ends_at'] ? (errors()['ends_at'] | transloco) : undefined"
    [value]="draft().endsAt"
    (valueChange)="set('endsAt', $event)"
  />
  <div class="flex flex-col gap-1">
    <label class="text-label-lg text-fg" for="promo-description"
      >{{ t('businessPanel.promotions.description') }}</label
    >
    <textarea
      id="promo-description"
      [placeholder]="t('placeholders.promoDescription')"
      rows="2"
      maxlength="300"
      class="w-full resize-y rounded-md border border-border bg-surface p-3 text-body text-fg focus-visible:outline-2 focus-visible:outline-border-focus"
      [attr.aria-invalid]="errors()['description'] ? 'true' : null"
      [attr.aria-describedby]="errors()['description'] ? 'promo-description-error' : 'promo-description-count'"
      [value]="draft().description"
      (input)="onDescription($event)"
      (blur)="check('description', draft().description)"
    ></textarea>
    @if (errors()['description']; as key) {
    <span id="promo-description-error" class="text-caption text-danger-fg" role="alert"
      >{{ t(key) }}</span
    >
    } @else {
    <span id="promo-description-count" class="text-right text-caption text-fg-subtle">{{
      t('businessPanel.form.counter', { count: draft().description.length, max: 300 })
    }}</span>
    }
  </div>
  <app-discount-fields
    [items]="items()"
    [itemError]="errors()['menu_item_id'] ? (errors()['menu_item_id'] | transloco) : undefined"
    [percentError]="errors()['discount_percent'] ? (errors()['discount_percent'] | transloco) : undefined"
    [itemId]="draft().menuItemId"
    (itemIdChange)="set('menuItemId', $event)"
    [percent]="draft().discount"
    (percentChange)="set('discount', $event)"
  />
  <app-image-field
    fieldId="promo-image"
    kind="promotions"
    [label]="t('businessPanel.images.promotion')"
    [alt]="draft().title"
    [businessId]="businessId()"
    [url]="draft().imageUrl"
    (changed)="set('imageUrl', $event)"
  />
  <div class="flex flex-col gap-2">
    <app-luma-button type="submit" [fullWidth]="true" [disabled]="busy()"
      >{{ t('businessPanel.promotions.save') }}</app-luma-button
    >
    <app-luma-button variant="ghost" [fullWidth]="true" (clicked)="cancelled.emit()"
      >{{ t('businessPanel.promotions.cancel') }}</app-luma-button
    >
  </div>
</form>
