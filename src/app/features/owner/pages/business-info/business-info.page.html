<div
  *transloco="let t"
  class="mx-auto flex max-w-lg flex-col gap-4 px-4 pt-[calc(env(safe-area-inset-top)+var(--spacing-6))] pb-6"
>
  <app-panel-header
    [heading]="t('businessPanel.info.title')"
    [backLink]="['/owner', id(), 'business']"
  />
  <app-setup-return />
  <app-panel-state [state]="panel.state()" (retry)="load()">
    <app-business-images />
    <form class="mt-5 flex flex-col gap-5" novalidate (submit)="save($event)">
      <app-draft-notice [draft]="autosave" />
      <app-business-basics-fields [idPrefix]="idPrefix" [businessId]="id()" [(errors)]="errors" [(draft)]="draft" />

      <div class="flex flex-col gap-1">
        <label class="text-label-lg text-fg" [for]="idPrefix + '-description'"
          >{{ t('businessPanel.form.description') }}</label
        >
        <textarea
          rows="3"
          class="w-full resize-y rounded-md border bg-surface p-3 text-body text-fg focus-visible:outline-2 focus-visible:outline-border-focus"
          [class.border-danger]="!!errors()['description']"
          [class.border-border]="!errors()['description']"
          [id]="idPrefix + '-description'"
          [placeholder]="t('placeholders.businessDescription')"
          [attr.maxlength]="descriptionMax"
          [attr.aria-invalid]="errors()['description'] ? 'true' : null"
          [attr.aria-describedby]="idPrefix + '-description-help'"
          [value]="description()"
          (input)="onDescription($event)"
          (blur)="checkDescription()"
        ></textarea>
        <p
          [id]="idPrefix + '-description-help'"
          class="m-0 text-right text-caption"
          [class.text-danger-fg]="!!errors()['description']"
          [class.text-fg-subtle]="!errors()['description']"
        >
          @if (errors()['description']; as key) { {{ t(key) }} } @else { {{
          t('businessPanel.form.counter', { count: description().length, max: descriptionMax }) }} }
        </p>
      </div>

      <app-luma-input
        [inputId]="idPrefix + '-prep'"
        [placeholder]="t('placeholders.prepMinutes')"
        inputMode="numeric"
        [digitsOnly]="true"
        [maxLength]="3"
        [label]="t('businessPanel.form.prepMinutes')"
        [hint]="t('businessPanel.form.prepHint')"
        [required]="true"
        [errorMessage]="errors()['prep_minutes'] ? (errors()['prep_minutes'] | transloco) : undefined"
        [value]="prepMinutes()"
        (valueChange)="onPrepMinutes($event)"
      />

      @if (errorKey(); as key) {
      <app-luma-notice tone="danger">
        {{ t(key) }}
      </app-luma-notice>
      }
      <app-luma-button type="submit" size="lg" [fullWidth]="true" [disabled]="saving()"
        >{{ t(saving() ? 'businessPanel.form.saving' : 'businessPanel.form.save')
        }}</app-luma-button
      >
    </form>
  </app-panel-state>
</div>
<app-re-review-sheet
  [open]="pendingSave() !== null"
  (confirmed)="confirmReReview()"
  (cancelled)="pendingSave.set(null)"
/>
