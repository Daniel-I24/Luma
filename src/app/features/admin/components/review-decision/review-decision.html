<app-luma-bottom-sheet
  *transloco="let t"
  titleId="review-decision-title"
  [open]="decision() !== null"
  [title]="decision() ? t('admin.review.confirm.' + decision()) : ''"
  (closed)="closed.emit()"
>
  <div class="flex flex-col gap-3">
    <p class="m-0 text-body text-fg-muted">{{ decision() ? t('admin.review.explain.' + decision()) : '' }}</p>
    @if (needsNote()) {
    <label class="text-label-lg text-fg" for="review-note">{{ t('admin.review.note') }}</label>
    <textarea
      id="review-note"
      rows="3"
      class="w-full resize-y rounded-md border border-border bg-surface p-3 text-body text-fg focus-visible:outline-2 focus-visible:outline-border-focus"
      [attr.maxlength]="noteMax"
      [attr.aria-invalid]="missingNote() ? 'true' : null"
      [attr.aria-describedby]="missingNote() ? 'review-note-error' : null"
      [value]="note()"
      (input)="onNote($event)"
    ></textarea>
    @if (missingNote()) {
    <p id="review-note-error" class="m-0 text-caption text-danger-fg" role="alert">{{ t('admin.errors.noteRequired') }}</p>
    } }
    <app-luma-button
      [variant]="decision() === 'approved' ? 'primary' : 'danger'"
      [fullWidth]="true"
      [disabled]="busy()"
      (clicked)="confirm()"
      >{{ decision() ? t('admin.review.actions.' + decision()) : '' }}</app-luma-button
    >
    <app-luma-button variant="ghost" [fullWidth]="true" (clicked)="closed.emit()">{{ t('admin.review.cancel') }}</app-luma-button>
  </div>
</app-luma-bottom-sheet>
