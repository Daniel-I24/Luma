<div class="flex h-full flex-col">
  <div class="relative min-h-[calc(var(--spacing)*75+env(safe-area-inset-top))] flex-[0_0_54%] overflow-hidden bg-map-canvas">
    <!-- Map canvas: outside *transloco so the static ViewChild resolves in ngOnInit -->
    <!-- MapLibre's CSS makes its container position: relative, so the
         positioning lives on a wrapper and the container only fills it. -->
    <div class="absolute inset-0">
      <div
        #mapContainer
        class="map-canvas size-full"
        role="region"
        [attr.aria-label]="'map.canvasLabel' | transloco"
      ></div>
    </div>

    <ng-container *transloco="let t">
      @if (mapFailed()) {
      <div class="absolute inset-0 z-10 flex items-center justify-center bg-canvas" role="alert">
        <app-luma-empty-state
          icon="map"
          tone="error"
          [heading]="t('map.mapUnavailableTitle')"
          [description]="t('map.mapUnavailable')"
        >
          <app-luma-refresh-button (clicked)="startMap()" />
        </app-luma-empty-state>
      </div>
      } @else {
      <app-map-top-bar
        [zone]="location.zoneText()"
        [canReturn]="location.canReturn()"
        (returnToMe)="location.centre()"
        [(query)]="store.query"
      />
      <app-map-controls
        [state]="location.state()"
        (locate)="location.centre()"
        (zoomIn)="camera.zoomIn()"
        (zoomOut)="camera.zoomOut()"
      />
      } @if (location.promptOpen()) {
      <app-location-prompt
        [failure]="location.failure()"
        [canOpenSettings]="location.canOpenSettings()"
        (allow)="location.allow()"
        (skip)="location.skip()"
        (settings)="location.openSettings()"
      />
      }
    </ng-container>
  </div>

  <div class="flex-1 overflow-y-auto bg-canvas pt-3">
    <app-nearby-panel
      data-tour="map-nearby"
      [items]="store.items()"
      [loading]="store.loading()"
      [errorKey]="store.errorKey()"
      [filtersActive]="store.filtersActive()"
      [outsideCoverage]="location.outsideCoverage()"
      (explorePasto)="location.explorePasto()"
      [selectedId]="selection.selectedId()"
      (selectBusiness)="focusBusiness($event)"
      (retry)="reload()"
      (clearFilters)="store.clearFilters()"
      (openAi)="openAi()"
    />
  </div>
</div>

<app-business-sheet
  [item]="selection.selected()"
  [hours]="selection.hours()"
  [promotion]="selection.promotion()"
  [open]="selection.open()"
  (closed)="selection.close()"
/>
