<div class="flex h-full flex-col">
  <div class="relative min-h-75 flex-[0_0_54%] overflow-hidden bg-map-canvas">
    <!-- Map canvas: outside *transloco so the static ViewChild resolves in ngOnInit -->
    <div
      #mapContainer
      class="map-canvas absolute inset-0"
      role="region"
      [attr.aria-label]="'map.canvasLabel' | transloco"
    ></div>

    <ng-container *transloco="let t">
      @if (mapFailed()) {
      <div class="absolute inset-0 z-10 flex items-center justify-center bg-canvas" role="alert">
        <app-luma-empty-state
          icon="map"
          tone="error"
          [heading]="t('map.mapUnavailableTitle')"
          [description]="t('map.mapUnavailable')"
        >
          <app-luma-button (clicked)="startMap()">{{ t('map.retry') }}</app-luma-button>
        </app-luma-empty-state>
      </div>
      } @else {
      <app-map-top-bar
        [categories]="store.categories()"
        [zoneKey]="zoneKey()"
        [(query)]="store.query"
        [(category)]="store.category"
      />
      <app-map-controls
        (locate)="onCentreOnMe()"
        (zoomIn)="camera.zoomIn()"
        (zoomOut)="camera.zoomOut()"
      />
      } @if (showLocationPrompt()) {
      <app-location-prompt (allow)="onAllowLocation()" (skip)="showLocationPrompt.set(false)" />
      }
    </ng-container>
  </div>

  <div class="flex-1 overflow-y-auto bg-canvas pt-3">
    <app-nearby-panel
      [items]="store.items()"
      [loading]="store.loading()"
      [errorKey]="store.errorKey()"
      [filtersActive]="store.filtersActive()"
      [selectedId]="selection.selectedId()"
      (selectBusiness)="selection.select($event)"
      (retry)="reload()"
      (clearFilters)="store.clearFilters()"
      (openAi)="openAi()"
    />
  </div>
</div>

<app-business-sheet
  [item]="selection.selected()"
  [hours]="selection.hours()"
  [promotion]="selection.promotion()"
  [open]="selection.open()"
  (closed)="selection.close()"
/>
