<main
  *transloco="let t"
  class="mx-auto flex min-h-dvh max-w-lg flex-col gap-4 bg-canvas px-4 pt-[calc(env(safe-area-inset-top)+var(--spacing-6))] pb-6"
>
  <h1 class="m-0 text-h2 text-fg">{{ t('accountDetails.title') }}</h1>
  <p class="m-0 text-body-sm text-fg-muted">{{ t('accountDetails.intro') }}</p>
  <form class="flex flex-col gap-4" novalidate (submit)="save($event)">
    <app-luma-input
      inputId="details-name"
      autocomplete="name"
      [label]="t('accountDetails.fullName')"
      [required]="true"
      [value]="form.fullName()"
      (valueChange)="form.fullName.set($event)"
    />
    <app-luma-input
      inputId="details-phone"
      type="tel"
      autocomplete="tel-national"
      inputMode="tel"
      [label]="t('accountDetails.phone')"
      [hint]="t('accountDetails.phonePurpose')"
      [required]="true"
      [value]="form.phone()"
      (valueChange)="form.phone.set($event)"
    />
    @if (loaded()) {
    <app-residence-picker [(value)]="form.residence" />
    }
    @if (form.errorKey(); as key) {
    <p class="m-0 rounded-md bg-danger-bg p-3 text-body-sm text-danger-fg" role="alert">{{ t(key) }}</p>
    }
    <app-luma-button type="submit" size="lg" [fullWidth]="true" [disabled]="form.saving()">{{
      t(form.saving() ? 'businessPanel.form.saving' : 'accountDetails.save')
    }}</app-luma-button>
    <app-luma-button variant="ghost" [fullWidth]="true" (clicked)="back()">{{ t('common.back') }}</app-luma-button>
  </form>
</main>
