<main
  *transloco="let t"
  class="mx-auto flex min-h-dvh max-w-lg flex-col gap-4 bg-canvas px-4 pt-[calc(var(--inset-top)+var(--spacing-6))] pb-6"
>
  <h1 class="m-0 text-h2 text-fg">{{ t('accountDetails.title') }}</h1>
  <p class="m-0 text-body-sm text-fg-muted">{{ t('accountDetails.intro') }}</p>
  <form class="flex flex-col gap-4" novalidate (submit)="save($event)">
    <app-luma-input
      inputId="details-name"
      [placeholder]="t('placeholders.fullName')"
      autocomplete="name"
      [label]="t('accountDetails.fullName')"
      [required]="true"
      [maxLength]="form.name.rule.maxLength"
      [value]="form.name.value()"
      (valueChange)="form.name.input($event)"
      (blurred)="form.name.blur()"
      [errorMessage]="form.name.error() ? t(form.name.error()!) : undefined"
    />
    <app-luma-input
      inputId="details-phone"
      [placeholder]="t('placeholders.mobile')"
      type="tel"
      autocomplete="tel-national"
      inputMode="tel"
      [label]="t('accountDetails.phone')"
      [hint]="t('accountDetails.phonePurpose')"
      [required]="true"
      [maxLength]="form.phone.rule.maxLength"
      [value]="form.phone.value()"
      (valueChange)="form.phone.input($event)"
      (blurred)="form.phone.blur()"
      [errorMessage]="form.phone.error() ? t(form.phone.error()!) : undefined"
    />
    @if (loaded()) {
    <app-residence-picker [(value)]="form.residence" />
    }
    @if (form.errorKey(); as key) {
    <app-luma-notice tone="danger">{{ t(key) }}</app-luma-notice>
    }
    <app-luma-button type="submit" size="lg" [fullWidth]="true" [disabled]="form.saving()">{{
      t(form.saving() ? 'businessPanel.form.saving' : 'accountDetails.save')
    }}</app-luma-button>
    <app-luma-button variant="ghost" [fullWidth]="true" (clicked)="back()">{{ t('common.back') }}</app-luma-button>
  </form>
  <app-phone-verification [phone]="mobile()" />
  <app-avatar-settings />
</main>
