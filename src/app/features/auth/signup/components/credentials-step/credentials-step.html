<div *transloco="let t" class="flex flex-col gap-4">
  <app-luma-input
    inputId="signup-email"
    type="email"
    inputMode="email"
    autocomplete="email"
    [label]="t('auth.register.emailLabel')"
    [placeholder]="t('auth.register.emailPlaceholder')"
    [required]="true"
    [value]="store.draft().email"
    (valueChange)="store.update('email', $event)"
    (blurred)="store.touch('email')"
    [errorMessage]="store.errors().email ? t(store.errors().email!) : undefined"
  />
  <app-luma-input
    inputId="signup-password"
    [type]="showPassword() ? 'text' : 'password'"
    autocomplete="new-password"
    [label]="t('auth.register.passwordLabel')"
    [placeholder]="t('auth.register.passwordPlaceholder')"
    [hint]="t('auth.signup.credentials.passwordRule')"
    [required]="true"
    [value]="store.draft().password"
    (valueChange)="store.update('password', $event)"
    [errorMessage]="store.errors().password ? t(store.errors().password!) : undefined"
  >
    <app-luma-icon-button
      slot="trailing"
      variant="ghost"
      [icon]="showPassword() ? 'eye-off' : 'eye'"
      [label]="t(showPassword() ? 'auth.signup.credentials.hidePassword' : 'auth.signup.credentials.showPassword')"
      [pressed]="showPassword()"
      (clicked)="showPassword.set(!showPassword())"
    />
  </app-luma-input>
  @if (store.draft().password) {
  <app-password-checklist checklistId="signup-password-checklist" [password]="store.draft().password" [email]="store.draft().email" />
  }
</div>
