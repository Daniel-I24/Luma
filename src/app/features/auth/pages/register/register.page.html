<ng-container *transloco="let t">
  <div class="auth-page">
    <app-luma-card elevation="raised">
      <header class="auth-header">
        <h1 class="auth-title">{{ t('auth.register.title') }}</h1>
        <p class="auth-subtitle">{{ t('auth.register.subtitle') }}</p>
      </header>

      <form class="auth-form" [formGroup]="form" (ngSubmit)="onSubmit()">
        <app-luma-input
          [label]="t('auth.register.emailLabel')"
          [placeholder]="t('auth.register.emailPlaceholder')"
          type="email"
          [required]="true"
          [value]="form.controls.email.value"
          (valueChange)="form.controls.email.setValue($event); form.controls.email.markAsDirty()"
          [errorMessage]="form.controls.email.dirty && form.controls.email.invalid
              ? t('auth.validation.emailInvalid') : undefined"
        />

        <app-luma-input
          [label]="t('auth.register.passwordLabel')"
          [placeholder]="t('auth.register.passwordPlaceholder')"
          type="password"
          autocomplete="new-password"
          [required]="true"
          [value]="form.controls.password.value"
          (valueChange)="form.controls.password.setValue($event); form.controls.password.markAsDirty()"
          [errorMessage]="form.controls.password.dirty && form.controls.password.invalid
              ? t('auth.validation.passwordWeak') : undefined"
        />

        @if (submission.errorKey()) {
        <p class="auth-error" role="alert">{{ t(submission.errorKey()!) }}</p>
        }

        <app-luma-button
          variant="primary"
          size="lg"
          type="submit"
          [disabled]="submission.submitting()"
          class="auth-submit"
          >{{ t('auth.register.submit') }}</app-luma-button
        >
      </form>

      <footer class="auth-footer">
        <p class="auth-switch">
          {{ t('auth.register.hasAccount') }}
          <a [routerLink]="['/auth/login']" class="auth-link"> {{ t('auth.register.login') }} </a>
        </p>
      </footer>
    </app-luma-card>
  </div>
</ng-container>
