@if (isOpen()) {
<div
  class="luma-bottom-sheet__overlay"
  aria-hidden="true"
  animate.enter="motion-enter-fade"
  animate.leave="motion-leave-fade"
  (click)="onOverlayClick()"
></div>
}

<div
  #panel
  [class]="panelClasses"
  role="dialog"
  [attr.aria-modal]="isOpen() ? 'true' : null"
  [attr.aria-labelledby]="labelledBy()"
  [attr.aria-hidden]="!isOpen() ? 'true' : null"
  [attr.tabindex]="isOpen() ? '-1' : null"
  (keydown)="onKeydown($event)"
  (click)="onPanelClick($event)"
>
  @if (title()) {
  <div
    class="luma-bottom-sheet__header luma-bottom-sheet__grab"
    (pointerdown)="drag.onPointerDown($event)"
    (pointermove)="drag.onPointerMove($event)"
    (pointerup)="drag.onPointerUp()"
    (pointercancel)="drag.onPointerUp()"
  >
    <h2 [id]="titleId()" class="luma-bottom-sheet__title">{{ title() }}</h2>
    <button
      class="luma-bottom-sheet__close"
      type="button"
      [attr.aria-label]="'common.close' | transloco"
      (click)="onCloseClick()"
    >
      <app-luma-icon name="close" />
    </button>
  </div>
  } @else {
  <button
    class="luma-bottom-sheet__handle luma-bottom-sheet__grab"
    type="button"
    [attr.aria-label]="'common.close' | transloco"
    (click)="onCloseClick()"
    (pointerdown)="drag.onPointerDown($event)"
    (pointermove)="drag.onPointerMove($event)"
    (pointerup)="drag.onPointerUp()"
    (pointercancel)="drag.onPointerUp()"
  >
    <span class="luma-bottom-sheet__grip"></span>
  </button>
  }

  <div class="luma-bottom-sheet__body">
    <ng-content />
  </div>
</div>
