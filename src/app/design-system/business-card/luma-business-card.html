@if (variant() === 'compact') {
<button
  type="button"
  class="flex w-36 cursor-pointer flex-col overflow-hidden rounded-lg border border-border-subtle bg-surface p-0 text-left shadow-card transition-transform duration-150 active:scale-97 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-border-focus"
  [class.border-primary]="current()"
  [attr.aria-current]="current() ? 'true' : null"
  (click)="selected.emit()"
>
  <span class="relative flex h-17 w-full items-center justify-center bg-canvas-subtle">
    <app-luma-avatar
      [name]="name()"
      [src]="logoUrl()"
      size="lg"
      shape="square"
      [decorative]="true"
    />
    @if (promoLabel(); as promo) {
    <span
      class="absolute top-1 right-1 max-w-28 truncate rounded-xs bg-danger px-1 text-caption font-extrabold text-danger-fg-on"
      >{{ promo }}</span
    >
    }
  </span>
  <span class="flex w-full flex-col gap-1 p-2">
    <span class="truncate text-label-lg font-bold text-fg">{{ name() }}</span>
    <span class="flex items-center justify-between gap-1">
      @if (rating() !== null) {
      <app-luma-rating-stars [rating]="rating()!" />
      }
      <app-status-badge size="sm" [status]="status()" />
    </span>
    @if (distanceLabel(); as distance) {
    <span class="text-caption text-fg-subtle">{{ distance }}</span>
    }
  </span>
</button>
} @else {
<button
  type="button"
  class="flex w-full cursor-pointer items-center gap-3 rounded-xl border border-border-subtle bg-surface p-3 text-left shadow-card transition-transform duration-150 active:scale-98 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-border-focus"
  [class.border-primary]="current()"
  [attr.aria-current]="current() ? 'true' : null"
  (click)="selected.emit()"
>
  <app-luma-avatar [name]="name()" [src]="logoUrl()" size="xl" shape="square" [decorative]="true" />
  <span class="flex min-w-0 flex-1 flex-col gap-1">
    <span class="truncate text-title text-fg">{{ name() }}</span>
    @if (category(); as cat) {
    <span class="text-caption text-fg-subtle">{{ cat }}</span>
    }
    <span class="flex items-center gap-2">
      @if (rating() !== null) {
      <app-luma-rating-stars [rating]="rating()!" />
      } @if (distanceLabel(); as distance) {
      <span class="text-caption text-fg-subtle">{{ distance }}</span>
      }
    </span>
  </span>
  <app-status-badge size="sm" [status]="status()" />
</button>
}
