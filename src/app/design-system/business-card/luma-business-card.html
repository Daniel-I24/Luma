@if (variant() === 'compact') {
<button
  type="button"
  class="flex h-full w-40 cursor-pointer flex-col overflow-hidden rounded-lg border border-border-subtle bg-surface p-0 text-left shadow-card pressable focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-border-focus"
  [class.border-primary]="current()"
  [attr.aria-current]="current() ? 'true' : null"
  (click)="selected.emit()"
>
  <span class="relative flex h-17 w-full items-center justify-center bg-surface-selected">
    <app-luma-avatar
      size="lg"
      shape="square"
      [name]="name()"
      [src]="logoUrl()"
      [fallbackIcon]="logoIcon()"
      [decorative]="true"
    />
    @if (promoLabel(); as promo) {
    <span
      class="absolute top-1 right-1 max-w-28 truncate rounded-xs bg-danger px-1 text-caption font-extrabold text-danger-fg-on"
      >{{ promo }}</span
    >
    }
  </span>
  <span class="flex w-full flex-1 flex-col items-start gap-1 p-2">
    <span class="line-clamp-2 min-h-[2lh] text-label-lg font-bold text-fg">{{ name() }}</span>
    <app-status-badge size="sm" [status]="status()" />
    <span class="flex w-full flex-wrap items-center gap-x-2">
      @if (rating() !== null) {
      <app-luma-rating-stars [rating]="rating()!" />
      } @else if (ratingFallback(); as text) {
      <span class="text-caption text-fg-subtle">{{ text }}</span>
      } @if (distanceLabel(); as distance) {
      <span class="text-caption text-fg-subtle">{{ distance }}</span>
      }
    </span>
  </span>
</button>
} @else {
<button
  type="button"
  class="flex w-full cursor-pointer items-center gap-3 rounded-xl border border-border-subtle bg-surface p-3 text-left shadow-card pressable focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-border-focus"
  [class.border-primary]="current()"
  [attr.aria-current]="current() ? 'true' : null"
  (click)="selected.emit()"
>
  <app-luma-avatar
    size="xl"
    shape="square"
    [name]="name()"
    [src]="logoUrl()"
    [fallbackIcon]="logoIcon()"
    [decorative]="true"
  />
  <span class="flex min-w-0 flex-1 flex-col gap-1">
    <span class="line-clamp-2 text-title text-fg">{{ name() }}</span>
    @if (category(); as cat) {
    <span class="text-caption text-fg-subtle">{{ cat }}</span>
    }
    <span class="flex flex-wrap items-center gap-x-2">
      @if (rating() !== null) {
      <app-luma-rating-stars [rating]="rating()!" />
      } @else if (ratingFallback(); as text) {
      <span class="text-caption text-fg-subtle">{{ text }}</span>
      } @if (distanceLabel(); as distance) {
      <span class="text-caption text-fg-subtle">{{ distance }}</span>
      }
    </span>
  </span>
  <app-status-badge class="shrink-0" size="sm" [status]="status()" />
</button>
}
