<span [class]="classes()">
  @if (src() && !failed()) {
  <img
    class="size-full object-cover"
    loading="lazy"
    [src]="src()"
    [alt]="decorative() ? '' : name()"
    (error)="failed.set(true)"
  />
  } @else { @if (fallbackIcon(); as icon) {
  <app-luma-icon [name]="icon" [size]="iconSize()" />
  } @else {
  <span aria-hidden="true">{{ initials() }}</span>
  } @if (!decorative()) {
  <span class="sr-only">{{ name() }}</span>
  } }
</span>
