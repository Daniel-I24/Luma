name: Keep Supabase awake

# Supabase pauses free projects after a week without database activity.
# Twice a week this reads one public row with the PUBLIC anon key (repository
# secrets SUPABASE_URL and SUPABASE_ANON_KEY, set by the owner). Without the
# secrets it does nothing. It never writes and never uses a secret key.
on:
  schedule:
    - cron: '17 13 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read one public row
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Secrets not set: nothing to do."
            exit 0
          fi
          case "$SUPABASE_ANON_KEY" in sb_secret_*) echo "Refusing a secret key."; exit 1;; esac
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/businesses?select=id&limit=1")
          echo "Supabase answered $status"
          [ "$status" = "200" ]
