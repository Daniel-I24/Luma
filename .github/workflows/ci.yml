name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Tracked files only; prints file:line and the kind, never the value.
      - name: Secret scan
        run: node scripts/secret-scan.mjs

      # Runtime dependencies only; dev-only findings are tracked in docs/security-notes.md.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # environment.ts is gitignored (real keys); CI builds with placeholders.
      - name: Create environment file
        run: cp src/environments/environment.example.ts src/environments/environment.ts

      - run: npm run build
      - run: npm run lint
      - name: Every button and link has an action
        run: npm run check:interactive
      - name: No URL outside the config modules
        run: npm run check:hardcoded-urls
      - name: Destructive actions use the danger button
        run: npm run check:buttons
      - name: Every theme passes AA contrast
        run: npm run check:contrast
      - name: Colours and sizes only through design tokens
        run: npm run check:tokens
      # Verbose: every test and the full detail of each failure in the log.
      - run: npm test -- --watch=false --reporters=verbose
      - run: npm run test:scripts

  database:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v7
      # Every migration on an empty database, then every SQL security suite.
      - name: SQL security suites
        run: bash supabase/tests/local/run.sh
      # Only the applied migrations, legacy data, then the pending ones.
      - name: Production-like rehearsal
        run: bash supabase/tests/local/rehearsal.sh

  functions:
    runs-on: ubuntu-24.04
    # The official Deno image: no third-party setup action.
    container: denoland/deno:2.5.6
    steps:
      - uses: actions/checkout@v7
      - name: Edge Function tests (fake fetch, no network to providers)
        run: |
          for dir in _shared delete-account recommend suggest-promotions extract-menu geocode push-dispatch create-payment wompi-webhook reconcile-payments void-payment; do
            echo "== $dir"
            (cd "supabase/functions/$dir" && deno test --no-lock --config deno.json -A)
          done
      - name: Lint (warning mode, same limits as the app; scripts/lint-functions.mjs)
        continue-on-error: true
        run: cd supabase/functions && deno lint --config deno.lint.json
      - name: Type check entry points
        run: |
          for dir in delete-account recommend suggest-promotions extract-menu geocode push-dispatch create-payment wompi-webhook reconcile-payments void-payment; do
            (cd "supabase/functions/$dir" && deno check --no-lock --config deno.json index.ts)
          done
