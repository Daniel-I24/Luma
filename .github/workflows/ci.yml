name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Tracked files only; prints file:line and the kind, never the value.
      - name: Secret scan
        run: node scripts/secret-scan.mjs

      # Runtime dependencies only; dev-only findings are tracked in docs/security-notes.md.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # environment.ts is gitignored (real keys); CI builds with placeholders.
      - name: Create environment file
        run: cp src/environments/environment.example.ts src/environments/environment.ts

      - run: npm run build
      - run: npm run lint
      - name: Every button and link has an action
        run: npm run check:interactive
      - name: Every form field has a validator
        run: npm run check:validation
      - name: Public legal pages match the app texts
        run: node scripts/build-legal.mjs --check
      - name: Every screen at 8 sizes and with 200 % text (no side scroll, no cut text, 44 px targets)
        run: |
          npx ng build --configuration screens
          npx playwright-core install --with-deps chromium
          node scripts/check-responsive.mjs --browser=chromium
      - name: End-to-end smoke flows on the web build with simulated services (no console errors)
        env:
          E2E_BROWSER: chromium
        run: npm run test:e2e
      - name: No URL outside the config modules
        run: npm run check:hardcoded-urls
      - name: Destructive actions use the danger button
        run: npm run check:buttons
      - name: Every theme passes AA contrast
        run: npm run check:contrast
      - name: Colours and sizes only through design tokens
        run: npm run check:tokens
      - name: Every text field has an example
        run: npm run check:placeholders
      - name: Duplicated code stays under the round 9 figure (.jscpd.json)
        run: npx --yes jscpd@5.4.2 --config .jscpd.json
      # Verbose: every test and the full detail of each failure in the log.
      # Coverage thresholds in angular.json (round 10: 83.6 % statements, 78.1 % branches).
      - run: npm test -- --watch=false --reporters=verbose --coverage
      - run: npm run test:scripts

  # What Vercel does: a clean clone, no environment.ts, only the public build variables.
  clean-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Production build from scratch, with test values
        env:
          SUPABASE_URL: https://clean-build-check.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_clean_build_check
          AI_MODE: remote
          PUSH_ENABLED: '1'
          SUPPORT_WHATSAPP: '573000000000'
          LEGAL_CONTACT_EMAIL: ci@example.com
        run: npm run build:prod

      - name: The output has what the web serves, with the values of the build
        run: |
          for file in index.html version.json pago-listo.html pago-listo.js \
            legal/terminos.html legal/privacidad.html legal/reembolsos.html legal/eliminacion-datos.html; do
            test -f "dist/luma/browser/$file" || { echo "missing: $file"; exit 1; }
          done
          grep -rlq clean-build-check.supabase.co dist/luma/browser --include='*.js'
          # The template URL must not be the configuration (EnvironmentCheck only holds its host).
          ! grep -rlq https://placeholder.supabase.co dist/luma/browser --include='*.js'

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The whole history, not only the tracked files of scripts/secret-scan.mjs.
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  database:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Every migration on an empty database, then every SQL security suite.
      - name: SQL security suites
        run: bash supabase/tests/local/run.sh
      # Only the applied migrations, legacy data, then the pending ones.
      - name: Production-like rehearsal
        run: bash supabase/tests/local/rehearsal.sh

  functions:
    runs-on: ubuntu-24.04
    # The official Deno image: no third-party setup action.
    container: denoland/deno:2.5.6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Edge Function tests (fake fetch, no network to providers)
        run: |
          for dir in _shared delete-account recommend suggest-promotions extract-menu geocode push-dispatch create-payment wompi-webhook reconcile-payments void-payment route verify-website whatsapp-webhook; do
            echo "== $dir"
            (cd "supabase/functions/$dir" && deno test --no-lock --config deno.json -A)
          done
      - name: Lint (warning mode, same limits as the app; scripts/lint-functions.mjs)
        continue-on-error: true
        run: cd supabase/functions && deno lint --config deno.lint.json
      - name: Type check entry points
        run: |
          for dir in delete-account recommend suggest-promotions extract-menu geocode push-dispatch create-payment wompi-webhook reconcile-payments void-payment route verify-website whatsapp-webhook; do
            (cd "supabase/functions/$dir" && deno check --no-lock --config deno.json index.ts)
          done
